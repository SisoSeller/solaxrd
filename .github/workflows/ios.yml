name: iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/SolaxRD.xcodeproj \
            -scheme SolaxRD \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP="ios/build/Build/Products/Release-iphoneos/SolaxRD.app"
          test -d "$APP"
          rm -rf ios/Payload
          mkdir ios/Payload
          cp -R "$APP" ios/Payload/
          rm -f ios/SolaxRD.ipa
          (cd ios && zip -qry SolaxRD.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: SolaxRD-ipa
          path: ios/SolaxRD.ipa
